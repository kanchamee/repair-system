<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แจ้งซ่อมอุปกรณ์ - Repair System</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="top-nav">
    <a href="index.html">← หน้าหลัก</a>
  </div>

  <div class="container">
    <div class="page-title">🛠️ แจ้งซ่อมอุปกรณ์</div>

    <form class="card" id="report-form">
      <label>สถานะผู้แจ้ง</label>
      <div class="choice-grid choice-grid-2" id="reporterType-choices">
        <button type="button" class="choice-btn" data-value="teacher"><span class="choice-emoji">🧑‍🏫</span>ครู/บุคลากร</button>
        <button type="button" class="choice-btn" data-value="student"><span class="choice-emoji">🎒</span>นักเรียน</button>
      </div>
      <input type="hidden" id="reporterType" required>

      <label>อีเมล</label>
      <input type="email" id="email" required>

      <label>ชื่อ-นามสกุล</label>
      <input type="text" id="fullName" required>

      <label>เบอร์โทรศัพท์</label>
      <input type="tel" id="phone" required pattern="[0-9]{9,10}">

      <div id="studentIdWrap" class="hidden">
        <label>เลขนักเรียน (5 หลัก)</label>
        <input type="text" id="studentId" maxlength="5" pattern="[0-9]{5}">
      </div>

      <label>วันที่แจ้ง</label>
      <input type="date" id="reportDate" required>

      <hr style="border:none;border-top:1px solid #eee;margin:20px 0;">

      <label>สถานที่เกิดปัญหา</label>
      <div class="choice-grid choice-grid-4" id="locationType-choices">
        <button type="button" class="choice-btn" data-value="classroom"><span class="choice-emoji">🏫</span>ห้องเรียน</button>
        <button type="button" class="choice-btn" data-value="bathroom"><span class="choice-emoji">🚻</span>ห้องน้ำ</button>
        <button type="button" class="choice-btn" data-value="subject"><span class="choice-emoji">📚</span>ห้องหมวด</button>
        <button type="button" class="choice-btn" data-value="office"><span class="choice-emoji">🗄️</span>ห้องสำนักงาน</button>
      </div>
      <input type="hidden" id="locationType" required>

      <div id="classroom-fields" class="hidden">
        <label>เลขห้องเรียน (เช่น 1500, 3988)</label>
        <input type="text" id="classroom-roomNumber">
      </div>

      <div id="bathroom-fields" class="hidden">
        <label>อาคาร</label>
        <select id="bathroom-building">
          <option value="">-- เลือกอาคาร --</option>
          <option value="1">อาคาร 1</option>
          <option value="2">อาคาร 2</option>
          <option value="3">อาคาร 3</option>
          <option value="4">อาคาร 4</option>
          <option value="5">อาคาร 5</option>
          <option value="6">อาคาร 6</option>
        </select>
        <div id="bathroom-dynamic"></div>
      </div>

      <div id="subject-fields" class="hidden">
        <label>กลุ่มสาระฯ</label>
        <select id="subject-group"></select>
        <label>ห้อง</label>
        <select id="subject-room"><option value="">-- เลือกกลุ่มสาระก่อน --</option></select>
      </div>

      <div id="office-fields" class="hidden">
        <p class="locked-note">สถานที่: อาคาร 1 ชั้น 2 (ล็อคอัตโนมัติ)</p>
        <label>ห้อง</label>
        <select id="office-room"></select>
      </div>

      <hr style="border:none;border-top:1px solid #eee;margin:20px 0;">

      <label>ประเภทปัญหาที่พบ</label>
      <select id="problemType" required></select>

      <div id="problemOtherWrap" class="hidden">
        <label>ระบุปัญหาอื่นๆ</label>
        <input type="text" id="problemOther">
      </div>

      <label>รายละเอียดปัญหาเพิ่มเติม</label>
      <textarea id="description" required></textarea>

      <label>แนบรูปภาพประกอบ (จำเป็น)</label>
      <input type="file" id="imageFile" accept="image/*" required>
      <p class="hint">ระบบจะบีบอัดรูปให้อัตโนมัติเพื่อส่งได้เร็ว โดยยังคงความคมชัดไว้ให้ผู้ดูแลเห็นรายละเอียด</p>

      <p class="field-error hidden" id="form-error">กรุณากรอกข้อมูลให้ครบถ้วนและแนบรูปภาพก่อนส่ง</p>

      <button type="submit" class="btn-primary" id="submit-btn">ส่งเรื่องแจ้งซ่อม</button>
    </form>
  </div>

  <div class="overlay hidden" id="success-popup">
    <div class="popup">
      <div class="emoji">🎉</div>
      <h3>รับเรื่องปัญหาเรียบร้อย</h3>
      <p>จะรีบดำเนินการให้เร็วที่สุดครับ/ค่ะ</p>
      <button class="btn-primary" onclick="window.location.href='index.html'">กลับหน้าหลัก</button>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="utils.js"></script>
  <script src="locations.js"></script>
  <script>
    function setupChoiceGroup(containerId, hiddenInputId) {
      const container = document.getElementById(containerId);
      const hiddenInput = document.getElementById(hiddenInputId);
      container.querySelectorAll(".choice-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          container.querySelectorAll(".choice-btn").forEach((b) => b.classList.remove("selected"));
          btn.classList.add("selected");
          hiddenInput.value = btn.dataset.value;
          hiddenInput.dispatchEvent(new Event("change"));
        });
      });
    }
    setupChoiceGroup("reporterType-choices", "reporterType");
    setupChoiceGroup("locationType-choices", "locationType");

    const reporterTypeEl = document.getElementById("reporterType");
    const studentIdWrap = document.getElementById("studentIdWrap");
    const studentIdInput = document.getElementById("studentId");
    const reportDateInput = document.getElementById("reportDate");
    reportDateInput.value = getBangkokNowForInput();

    reporterTypeEl.addEventListener("change", () => {
      if (reporterTypeEl.value === "student") {
        studentIdWrap.classList.remove("hidden");
        studentIdInput.setAttribute("required", "required");
      } else {
        studentIdWrap.classList.add("hidden");
        studentIdInput.removeAttribute("required");
      }
    });

    // ===== ประเภทปัญหา =====
    const problemTypeEl = document.getElementById("problemType");
    problemTypeEl.innerHTML = optionsHtml(PROBLEM_TYPES, "-- เลือกประเภทปัญหา --");
    const problemOtherWrap = document.getElementById("problemOtherWrap");
    const problemOtherInput = document.getElementById("problemOther");
    problemTypeEl.addEventListener("change", () => {
      if (problemTypeEl.value === "other") {
        problemOtherWrap.classList.remove("hidden");
        problemOtherInput.setAttribute("required", "required");
      } else {
        problemOtherWrap.classList.add("hidden");
        problemOtherInput.removeAttribute("required");
      }
    });

    // ===== สถานที่เกิดปัญหา =====
    const locationTypeEl = document.getElementById("locationType");
    const sections = {
      classroom: document.getElementById("classroom-fields"),
      bathroom: document.getElementById("bathroom-fields"),
      subject: document.getElementById("subject-fields"),
      office: document.getElementById("office-fields")
    };

    function clearRequired(section) {
      section.querySelectorAll("input, select").forEach((el) => el.removeAttribute("required"));
    }
    function setRequired(section) {
      section.querySelectorAll("input:not([type=hidden]), select").forEach((el) => el.setAttribute("required", "required"));
    }

    locationTypeEl.addEventListener("change", () => {
      Object.values(sections).forEach((s) => { s.classList.add("hidden"); clearRequired(s); });
      const chosen = sections[locationTypeEl.value];
      if (chosen) { chosen.classList.remove("hidden"); setRequired(chosen); }
    });

    // ห้องน้ำ
    const bathroomBuildingEl = document.getElementById("bathroom-building");
    const bathroomDynamic = document.getElementById("bathroom-dynamic");
    bathroomBuildingEl.addEventListener("change", () => {
      renderBathroomFields(bathroomDynamic, bathroomBuildingEl.value, "bathroom");
      setRequired(sections.bathroom);
    });

    // ห้องหมวด
    const subjectGroupEl = document.getElementById("subject-group");
    const subjectRoomEl = document.getElementById("subject-room");
    subjectGroupEl.innerHTML = optionsHtml(Object.keys(SUBJECT_GROUPS), "-- เลือกกลุ่มสาระ --");
    subjectGroupEl.addEventListener("change", () => {
      const rooms = SUBJECT_GROUPS[subjectGroupEl.value] || [];
      subjectRoomEl.innerHTML = optionsHtml(rooms, "-- เลือกห้อง --");
    });

    // ห้องสำนักงาน
    const officeRoomEl = document.getElementById("office-room");
    officeRoomEl.innerHTML = optionsHtml(OFFICE_ROOMS, "-- เลือกห้อง --");

    // ===== ส่งฟอร์ม =====
    const form = document.getElementById("report-form");
    const submitBtn = document.getElementById("submit-btn");
    const formError = document.getElementById("form-error");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      formError.classList.add("hidden");

      const imageInput = document.getElementById("imageFile");
      if (!imageInput.files[0]) {
        formError.textContent = "กรุณาแนบรูปภาพก่อนส่งเรื่อง";
        formError.classList.remove("hidden");
        return;
      }
      if (!form.checkValidity()) {
        formError.textContent = "กรุณากรอกข้อมูลให้ครบถ้วน";
        formError.classList.remove("hidden");
        form.reportValidity();
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "กำลังส่ง...";

      try {
        const imageUrl = await uploadCompressedImage(imageInput.files[0], "reports");

        const locationType = locationTypeEl.value;
        let locationDetail = {};
        if (locationType === "classroom") {
          locationDetail = { roomNumber: document.getElementById("classroom-roomNumber").value.trim() };
        } else if (locationType === "bathroom") {
          const building = bathroomBuildingEl.value;
          const floorEl = document.getElementById("bathroom-floor");
          const sideEl = document.getElementById("bathroom-side");
          const typeEl = document.getElementById("bathroom-type");
          locationDetail = {
            building,
            floor: floorEl ? floorEl.value : "",
            side: sideEl ? sideEl.value : null,
            type: typeEl ? typeEl.value : ""
          };
        } else if (locationType === "subject") {
          locationDetail = { group: subjectGroupEl.value, room: subjectRoomEl.value };
        } else if (locationType === "office") {
          locationDetail = { room: officeRoomEl.value, location: OFFICE_LOCATION_LABEL };
        }

        const reporterType = reporterTypeEl.value;
        const dateVal = reportDateInput.value;

        const payload = {
          reporterType,
          email: document.getElementById("email").value.trim(),
          fullName: document.getElementById("fullName").value.trim(),
          phone: document.getElementById("phone").value.trim(),
          studentId: reporterType === "student" ? studentIdInput.value.trim() : null,
          reportDate: dateVal,
          month: getMonthFromInputValue(dateVal),
          locationType,
          locationDetail,
          locationLabel: buildLocationLabel(locationType, locationDetail),
          problemType: problemTypeEl.value,
          problemOther: problemTypeEl.value === "other" ? problemOtherInput.value.trim() : null,
          description: document.getElementById("description").value.trim(),
          imageUrl,
          status: "received",
          createdAt: firebase.database.ServerValue.TIMESTAMP,
          reply: null
        };

        await db.ref("reports").push(payload);

        document.getElementById("success-popup").classList.remove("hidden");
        form.reset();
        document.querySelectorAll(".choice-btn.selected").forEach((b) => b.classList.remove("selected"));
        Object.values(sections).forEach((s) => { s.classList.add("hidden"); clearRequired(s); });
        studentIdWrap.classList.add("hidden");
        problemOtherWrap.classList.add("hidden");
        reportDateInput.value = getBangkokNowForInput();
      } catch (err) {
        formError.textContent = "เกิดข้อผิดพลาด: " + (err && err.message ? err.message : "กรุณาลองใหม่อีกครั้ง");
        formError.classList.remove("hidden");
        console.error(err);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "ส่งเรื่องแจ้งซ่อม";
      }
    });
  </script>
</body>
</html>
